name: Generated JSON

# openapi.json is generated upstream and changes only through the automated
# "[Auto] Publish API schema for release …" PR (branch docs/openapi-sync).
# Git merges JSON as text, which can leave duplicate keys that every parser
# silently collapses; scripts/check_generated_json.py catches that.

on:
  pull_request:
    paths:
      - 'openapi.json'
      - 'mint.json'
      - 'cekura-mcp-server/mcp_tools.json'
      - 'scripts/check_generated_json.py'
      - '.github/workflows/generated-json.yml'
  push:
    branches:
      - main
    paths:
      - 'openapi.json'
      - 'mint.json'
      - 'cekura-mcp-server/mcp_tools.json'
      - 'scripts/check_generated_json.py'
      - '.github/workflows/generated-json.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check generated JSON files
        run: python3 scripts/check_generated_json.py

      - name: Only the release PR changes what openapi.json says
        if: github.event_name == 'pull_request' && github.head_ref != 'docs/openapi-sync'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:openapi.json > "$RUNNER_TEMP/openapi-base.json"
          python3 scripts/check_generated_json.py --unchanged-from "$RUNNER_TEMP/openapi-base.json"
