name: OpenAPI Check

on:
  pull_request:
    paths:
      - 'openapi.json'
      - 'mint.json'
      - 'scripts/check_json_duplicate_keys.py'
      - '.github/workflows/openapi-check.yml'
  push:
    branches:
      - main
    paths:
      - 'openapi.json'
      - 'mint.json'
      - 'scripts/check_json_duplicate_keys.py'
      - '.github/workflows/openapi-check.yml'

permissions:
  contents: read

jobs:
  duplicate-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject duplicated JSON keys
        run: python3 scripts/check_json_duplicate_keys.py openapi.json mint.json
